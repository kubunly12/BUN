</style></head><body><header><div><h1>继发性肾病综合征｜PBL思维导图</h1><small>⑧ 继发性病因与本病例尚未排查的疾病 · 基于病例前两页</small></div><div class="toolbar"><button onclick="expandAll()">全部展开</button><button onclick="collapseAll()">全部收起</button><button onclick="zoom(1.2)">＋放大</button><button onclick="zoom(1/1.2)">－缩小</button><button onclick="resetView()">居中</button></div></header><div class="hint">操作：点击分支展开/收起；点击末端卡片查看病例关联；拖动空白区域移动画布；鼠标滚轮缩放。所有内容可离线查看。</div><div class="viewport" id="vp"><div class="stage" id="stage"><svg class="connectors" id="lines" width="1650" height="1200"></svg><div id="nodes"></div></div><div class="legend">提示：尚未排查 ≠ 已确诊；第三页结果未纳入。</div><div class="detail" id="detail"><button onclick="document.getElementById('detail').style.display='none'">×</button><h2>使用说明</h2><p>点击任意分支查看详细说明；一级分支可以折叠、展开。下方“病例评估”专门整理目前缺少哪些病因线索。</p></div></div><script>
const data={id:'root',title:'继发性肾病综合征',desc:'病因分类 · 病例联系 · 尚未排查',detail:'肾病综合征为临床综合征；仍需调查是否存在全身性疾病、感染、药物或异常蛋白等继发原因。',children:[
{id:'immune',title:'① 自身免疫性',color:'#7b70bf',desc:'狼疮性肾炎、IgA血管炎',children:[{title:'狼疮性肾炎（SLE）',desc:'免疫复合物沉积；可有皮疹、关节痛、蛋白尿',detail:'患者无典型皮疹、光敏感和关节症状，但仅根据前两页尚无免疫学筛查结果，不能排除。'},{title:'IgA血管炎性肾炎',desc:'常伴紫癜、腹痛、关节症状',detail:'本例缺乏典型紫癜及腹痛，支持证据较少；作为次要鉴别病因。'}]},
{id:'infection',title:'② 感染相关',color:'#268a8a',desc:'病毒相关肾小球损伤',children:[{title:'HBV相关肾病',desc:'可伴膜性肾病表现',detail:'暂无乙肝病毒筛查结果，属于尚未排查的继发病因。'},{title:'HCV相关肾病',desc:'常与免疫复合物性肾炎相关',detail:'前两页无丙肝相关检查；需保留在病因鉴别中。'},{title:'HIV相关肾病',desc:'可出现显著蛋白尿',detail:'前两页无HIV相关筛查资料。'}]},
{id:'metabolic',title:'③ 代谢性',color:'#c27e31',desc:'糖尿病肾脏病',children:[{title:'糖尿病肾脏病',desc:'长期高血糖相关肾小球损伤',detail:'本例无糖尿病史、空腹血糖3.8 mmol/L，支持证据少，但不能仅凭一次血糖完成全部病因评估。'}]},
{id:'drugs',title:'④ 药物相关',color:'#b85f81',desc:'关注用药和暴露史',children:[{title:'NSAIDs',desc:'布洛芬、双氯芬酸等',detail:'某些NSAIDs可关联微小病变病或膜性肾病。本例缺乏完整药物使用史。'},{title:'其他药物',desc:'青霉胺、金制剂等',detail:'应询问处方药、非处方药、保健品及中草药；冬瓜薏米汤不能直接认定为致病因素。'}]},
{id:'malignancy',title:'⑤ 肿瘤相关',color:'#567eb8',desc:'实体肿瘤、血液系统肿瘤',children:[{title:'实体肿瘤',desc:'部分肿瘤与膜性肾病相关',detail:'现有资料无特异肿瘤线索，不作为首要怀疑，但必要时需按年龄及风险评估。'},{title:'霍奇金淋巴瘤',desc:'可与微小病变病相关',detail:'需结合淋巴结肿大、全身症状等线索；本例前两页未提供支持证据。'}]},
{id:'protein',title:'⑥ 异常蛋白相关',color:'#7a8e41',desc:'蛋白沉积及单克隆免疫球蛋白',children:[{title:'AL型淀粉样变性',desc:'异常轻链沉积；可致大量蛋白尿',detail:'本例虽有大量蛋白尿，但缺少系统性器官累及线索，需选择性鉴别。'},{title:'单克隆免疫球蛋白相关肾损害',desc:'可引起蛋白尿与肾功能改变',detail:'现有资料无法确定；是否开展专项检查应根据病史及风险判断。'}]},
{id:'case',title:'⑦ 本病例尚未排查',color:'#c3524a',desc:'按前两页证据判断',children:[{title:'需重点补充',desc:'感染史、药物史、免疫病因',detail:'自身免疫病：缺乏典型症状但无相应筛查结果；感染：HBV/HCV/HIV结果未提供；药物：用药和暴露史不完整。'},{title:'支持证据相对较弱',desc:'糖尿病、IgA血管炎',detail:'无糖尿病史且空腹血糖正常；无典型紫癜、腹痛、关节症状。可能性相对较低，并非绝对排除。'},{title:'选择性评估',desc:'肿瘤、淀粉样变性等',detail:'现有资料缺乏特异线索，可按后续病史和检查选择性评估。详细检查由⑨同学负责。'}]}
]};
let collapsed=new Set(), scale=.82,tx=85,ty=65;const stage=document.getElementById('stage'),vp=document.getElementById('vp'),nodes=document.getElementById('nodes'),lines=document.getElementById('lines');const all=data.children;const lookup=new Map();function walk(n){lookup.set(n.id||n.title,n);(n.children||[]).forEach(walk)}walk(data);
function layout(){nodes.innerHTML='';lines.innerHTML='';const show=(n,x,y,cls,color)=>{const el=document.createElement('div');el.className='node '+cls;el.style.cssText=`left:${x}px;top:${y}px;--accent:${color||'#6685b7'}`;el.innerHTML=`${n.children?'<span class="toggle">'+(collapsed.has(n.id)?'+':'−')+'</span>':''}<strong>${n.title}</strong><div class="sub">${n.desc||''}</div>`;el.onclick=e=>{e.stopPropagation();if(n.children){if(collapsed.has(n.id))collapsed.delete(n.id);else collapsed.add(n.id);layout()}detail(n)};nodes.appendChild(el)};const path=(x1,y1,x2,y2,c)=>{const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',`M ${x1} ${y1} C ${x1+52} ${y1} ${x2-52} ${y2} ${x2} ${y2}`);p.setAttribute('stroke',c);p.setAttribute('stroke-width','2.4');p.setAttribute('fill','none');p.setAttribute('opacity','.65');lines.appendChild(p)};
show(data,25,435,'center');let y=16;all.forEach((n,i)=>{let count=collapsed.has(n.id)?0:n.children.length;let height=Math.max(105,count*88+16);let py=y+Math.max(0,(height-76)/2);path(310,477,410,py+36,n.color);show(n,410,py,'parent',n.color);if(!collapsed.has(n.id)){n.children.forEach((c,j)=>{let cy=y+10+j*88;path(665,py+36,735,cy+30,n.color);show(c,735,cy,'',n.color)})}y+=height+14});stage.style.height=Math.max(y+80,900)+'px';lines.setAttribute('height',Math.max(y+80,900));apply()}
function detail(n){let d=document.getElementById('detail');d.style.display='block';d.innerHTML=`<button onclick="document.getElementById('detail').style.display='none'">×</button><div class="tag">PBL · 继发性病因分析</div><h2>${n.title}</h2><p>${n.detail||n.desc||'点击子分支查看具体内容。'}</p>`}function apply(){stage.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`}function zoom(k){scale=Math.max(.35,Math.min(2,scale*k));apply()}function resetView(){scale=Math.min(.94,Math.max(.52,(vp.clientWidth-100)/1100));tx=35;ty=30;apply()}function expandAll(){collapsed.clear();layout()}function collapseAll(){collapsed=new Set(all.map(n=>n.id));layout()}let dragging=false,sx=0,sy=0;vp.addEventListener('pointerdown',e=>{if(e.target.closest('.node,.detail,button'))return;dragging=true;sx=e.clientX-tx;sy=e.clientY-ty;vp.setPointerCapture(e.pointerId)});vp.addEventListener('pointermove',e=>{if(!dragging)return;tx=e.clientX-sx;ty=e.clientY-sy;apply()});vp.addEventListener('pointerup',()=>dragging=false);vp.addEventListener('wheel',e=>{if(e.target.closest('.detail'))return;e.preventDefault();zoom(e.deltaY<0?1.08:1/1.08)},{passive:false});layout();resetView();
</script></body></html>
